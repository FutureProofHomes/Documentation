theme:
  logo: assets/square_transparent_black_logo_vector_300x300.svg
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.expand
    - navigation.tracking
    - navigation.prune
    
    # - toc.integrate
    
    - search.suggest
    - search.highlight
    # - search.share
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
      primary: custom
      accent: custom
    - scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
      primary: custom
      accent: custom
extra_css:
  - stylesheets/extra.css
  - stylesheets/firmware_selector.css
extra:
  social:
    # - icon: fontawesome/icon/home
    #   link: https://futureproofhomes.net
    - icon: fontawesome/brands/github-alt
      link: https://github.com/FutureProofHomes
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@futureproofhomes
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/AIVoiceAssist
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/futureproofhome

markdown_extensions:
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/version_hook.py
  - hooks/compat_matrix_hook.py

plugins:
  - search
  - redirects:
      redirect_maps:
        'satellite1-smart-speaker-enclosure-kit.md': 'satellite1-smart-speaker.md'
        'satellite1-mount-kit-overview.md': 'satellite1-in-ceiling.md'
        'satellite1-recommended-accessories.md': 'satellite1-accessories.md'
        'satellite1-assembly.md': 'satellite1-dev-kit.md'
        'satellite1-presence-sensors.md': 'satellite1-mmwave-overview.md'
  # - optimize
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
      auto_caption: false
      caption_position: bottom
      background: white
      shadow: true
      manual: false

extra_javascript:
  # - javascript/installer.js
  - javascript/esp-web-tools/install-button.js
  # - https://cdn.jsdelivr.net/npm/esp-web-tools@10/dist/web/install-button.js?module
  - javascript/keyboard_shortcuts_fix.js
  - javascript/firmware_selector.js
  - javascript/faq-expand-on-hash.js
  - javascript/toc_tab_sync.js
  - javascript/firmware_toggle.js

copyright: |
  &copy; 2024 <a href="https://futureproofhomes.net" target="_blank" rel="noopener">FutureProofHomes, Inc</a>
