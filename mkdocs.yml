      - Print the Enclosure: satellite1-print-enclosure.md
    - Dev Kit: satellite1-dev-kit.md
    - Firmware:
      - Flash via USB-C: satellite1-flash-via-usb-c.md
      - Modifying the Firmware: satellite1-modifying-the-firmware.md
    - Using Your Satellite1:
      - Set Up Your Voice Assistant: satellite1-set-up-voice-control.md
      - Streaming Music: satellite1-streaming-music.md
      - Helpful Automations: satellite1-helpful-automations.md
    - Hardware Reference:
      - DIY Enclosures:
